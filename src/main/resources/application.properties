spring.application.name=TeaSmart

server.port=${SERVER_PORT:8080}

# Required environment variables; no guessed credentials or database creation.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000

# The frozen ERD owns the schema. Hibernate may validate, never create/update it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Google identity is opt-in. Never enables migration or changes TeaSmart JWT.
teasmart.google.enabled=${GOOGLE_AUTH_ENABLED:false}
teasmart.google.client-id=${GOOGLE_CLIENT_ID:}
teasmart.google.allowed-origins=${GOOGLE_ALLOWED_ORIGINS:}
# Hibernate's constraint-error messages can include email/sub values during races.
# Exceptions are handled through safe API error responses; never log those values.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Required signing secret; never store a real value in source.
teasmart.jwt.secret-base64=${JWT_SECRET_BASE64}
teasmart.jwt.issuer=${JWT_ISSUER}
teasmart.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# Private storage outside the repository; override for deployment.
teasmart.review-images.storage-root=${REVIEW_IMAGE_STORAGE_ROOT:${user.home}/.teasmart/review-images}
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=27262976B
spring.servlet.multipart.file-size-threshold=0B

# Local Review AI; HTTP inference runs outside database transactions.
teasmart.review-ai.base-url=${REVIEW_AI_BASE_URL:http://127.0.0.1:8000}
teasmart.review-ai.timeout-seconds=${REVIEW_AI_TIMEOUT_SECONDS:15}
teasmart.review-ai.lease-seconds=${REVIEW_AI_LEASE_SECONDS:45}

# Sandbox only. Migration is manual; never applied automatically to teasmart.
teasmart.checkout.session-ttl-minutes=${CHECKOUT_SESSION_TTL_MINUTES:60}
teasmart.checkout.reservation-ttl-minutes=${CHECKOUT_RESERVATION_TTL_MINUTES:60}
teasmart.checkout.reconciliation-grace-minutes=${CHECKOUT_RECONCILIATION_GRACE_MINUTES:15}
teasmart.vnpay.enabled=${VNPAY_ENABLED:false}
teasmart.vnpay.reconciliation-enabled=${VNPAY_RECONCILIATION_ENABLED:true}
teasmart.vnpay.tmn-code=${VNPAY_TMN_CODE:}
teasmart.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
teasmart.vnpay.return-url=${VNPAY_RETURN_URL:}
teasmart.vnpay.expiry-minutes=${VNPAY_EXPIRY_MINUTES:15}
# Empty until the merchant has confirmed final failure semantics with VNPAY.
# Only response pairs validated by signature, merchant, reference and amount may
# end a payment attempt. VNPay defines 24 as customer cancellation; 02 is its
# final transaction status. Keep an explicit override for merchant-specific policy.
teasmart.vnpay.verified-final-failure-pairs=${VNPAY_VERIFIED_FINAL_FAILURE_PAIRS:24:02}

# Chatbot RAG is opt-in; no key is stored here and no schema initialization is enabled.
teasmart.rag.enabled=${RAG_ENABLED:false}
teasmart.rag.url=${RAG_SERVICE_URL:http://127.0.0.1:8002}

# Explicit opt-in: configure only after approval for real email delivery.
teasmart.mail.enabled=${MAIL_ENABLED:false}
teasmart.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# Private local VNPay values; Process environment can override them.
spring.config.import=optional:file:${user.home}/.teasmart/vnpay-local.properties

# Gallery remains disabled until its separate migration is approved/applied.
teasmart.product-images.enabled=${PRODUCT_IMAGES_ENABLED:false}

# Enable only after migration 1104 has passed on the intended database.
teasmart.seller.enabled=${TEASMART_SELLER_ENABLED:true}
teasmart.seller.foundation-enabled=${TEASMART_SELLER_FOUNDATION_ENABLED:false}
teasmart.seller.profile-details-enabled=${TEASMART_SELLER_PROFILE_DETAILS_ENABLED:false}

# Enable only after verifying migration 1108; disabled on existing environments.
teasmart.seller.product-archive-enabled=${TEASMART_SELLER_PRODUCT_ARCHIVE_ENABLED:false}

# Google linking code flow: backend-only secret; no schema migration.
teasmart.google.link.client-secret=${GOOGLE_CLIENT_SECRET:}
teasmart.google.link.redirect-uri=${GOOGLE_LINK_REDIRECT_URI:}

# Enable only after auth05 migration and SMTP setup.
teasmart.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
teasmart.password-reset.frontend-url=${FRONTEND_BASE_URL:http://localhost:3000}

spring.application.name=TeaSmart

server.port=${SERVER_PORT:8080}

# Required environment variables; no guessed credentials or database creation.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000

# The frozen ERD owns the schema. Hibernate may validate, never create/update it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Required signing secret; never store a real value in source.
teasmart.jwt.secret-base64=${JWT_SECRET_BASE64}
teasmart.jwt.issuer=${JWT_ISSUER}
teasmart.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# Private storage outside the repository; override for deployment.
teasmart.review-images.storage-root=${REVIEW_IMAGE_STORAGE_ROOT:${user.home}/.teasmart/review-images}
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=27262976B
spring.servlet.multipart.file-size-threshold=0B

# Local Review AI; HTTP inference runs outside database transactions.
teasmart.review-ai.base-url=${REVIEW_AI_BASE_URL:http://127.0.0.1:8000}
teasmart.review-ai.timeout-seconds=${REVIEW_AI_TIMEOUT_SECONDS:15}
teasmart.review-ai.lease-seconds=${REVIEW_AI_LEASE_SECONDS:45}

# Sandbox only. Migration is manual; never applied automatically to teasmart.
teasmart.vnpay.enabled=${VNPAY_ENABLED:false}
teasmart.vnpay.tmn-code=${VNPAY_TMN_CODE:}
teasmart.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
teasmart.vnpay.return-url=${VNPAY_RETURN_URL:}
teasmart.vnpay.expiry-minutes=${VNPAY_EXPIRY_MINUTES:15}
# Empty until the merchant has confirmed final failure semantics with VNPAY.
teasmart.vnpay.verified-final-failure-pairs=${VNPAY_VERIFIED_FINAL_FAILURE_PAIRS:}

# Isolated presentation/test profile. Deliberately never falls back to DB_URL.
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/teasmart_product_test
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000

# Schema changes remain explicit; run the approved SQL migration manually after
# verifying the selected catalog. Never use Hibernate to create/update tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Do not inherit a local/main payment toggle into a demo run by accident.
teasmart.vnpay.enabled=${DEMO_VNPAY_ENABLED:false}

# Demo fixture predates Seller phase 1; require explicit migration before enabling.
teasmart.seller.enabled=false

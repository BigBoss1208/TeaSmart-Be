# Explicit local acceptance profile. Never falls back to DB_URL or port 3306.
server.port=8081
spring.datasource.url=jdbc:mysql://127.0.0.1:33377/teasmart_demo
spring.datasource.username=${PAYMENT_TEST_USERNAME:root}
spring.datasource.password=${PAYMENT_TEST_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# Merchant credentials remain in the existing private config, never in this file.
teasmart.vnpay.return-url=http://127.0.0.1:3001/payment/vnpay-return
teasmart.vnpay.reconciliation-enabled=false
# These pairs are accepted only AFTER signature, merchant, reference and amount verification.
# VNPay response codes: https://sandbox.vnpayment.vn/apis/docs/bang-ma-loi/
teasmart.vnpay.verified-final-failure-pairs=24:02,51:02
teasmart.mail.enabled=false
teasmart.google.enabled=false
teasmart.seller.enabled=false
